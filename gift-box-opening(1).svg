<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">A gift for you — Redone Barber at Home</title><desc id="desc">An animated luxury gift box opens to reveal a free facial gommage with every haircut.</desc>
<style>
*{box-sizing:border-box} .bg{fill:#101716}.glow{fill:#c5a46a;opacity:.12;filter:url(#blur)}
.kicker,.copy,.small{font-family:Arial,sans-serif;text-anchor:middle}.serif{font-family:Georgia,serif;text-anchor:middle}
.kicker{font-size:16px;letter-spacing:5px;fill:#cbb58c}.headline{font-size:49px;letter-spacing:1.5px;fill:#f7f1e7}.copy{font-size:17px;letter-spacing:2px;fill:#c9c8bd}.gommage{font-size:37px;letter-spacing:3px;fill:#f2d8a2}.small{font-size:13px;letter-spacing:3px;fill:#d7c39c}
.box{filter:url(#shadow)}
.lid{transform-box:view-box;transform-origin:600px 410px;animation:lidOpen 7s cubic-bezier(.2,.75,.25,1) infinite}
.message{opacity:0;transform-box:fill-box;transform-origin:center;animation:message 7s ease-in-out infinite}
.rays{opacity:0;transform-box:fill-box;transform-origin:center;animation:rays 7s ease-in-out infinite}
.spark{opacity:0;animation:sparkle 7s ease-out infinite;transform-box:fill-box;transform-origin:center}
.s1{animation-delay:.05s}.s2{animation-delay:.2s}.s3{animation-delay:.32s}.s4{animation-delay:.46s}.s5{animation-delay:.58s}.s6{animation-delay:.7s}.s7{animation-delay:.84s}.s8{animation-delay:.96s}
@keyframes lidOpen{0%,13%{transform:translate(0,0) rotate(0)}22%{transform:translate(0,-8px) rotate(-3deg)}43%,78%{transform:translate(-55px,-155px) rotate(-19deg)}88%,100%{transform:translate(0,0) rotate(0)}}
@keyframes message{0%,22%{opacity:0;transform:translateY(22px) scale(.96)}38%,73%{opacity:1;transform:translateY(0) scale(1)}84%,100%{opacity:0;transform:translateY(8px) scale(.98)}}
@keyframes rays{0%,22%,82%,100%{opacity:0;transform:scale(.8)}38%,68%{opacity:1;transform:scale(1)}}
@keyframes sparkle{0%,24%{opacity:0;transform:translateY(20px) scale(.2) rotate(0)}37%{opacity:1}62%{opacity:.85;transform:translateY(-24px) scale(1) rotate(30deg)}80%,100%{opacity:0;transform:translateY(-45px) scale(.2) rotate(70deg)}}
@media(prefers-reduced-motion:reduce){.lid,.message,.rays,.spark{animation:none}.lid{transform:translate(-55px,-155px) rotate(-19deg)}.message,.rays{opacity:1}}
</style>
<defs>
 <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2623"/><stop offset="1" stop-color="#0b100f"/></linearGradient>
 <linearGradient id="boxGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c4a16b"/><stop offset=".5" stop-color="#a9804e"/><stop offset="1" stop-color="#765735"/></linearGradient>
 <linearGradient id="lidGrad" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e1c58f"/><stop offset="1" stop-color="#ad8958"/></linearGradient>
 <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2e4c5"/><stop offset="1" stop-color="#d0b47d"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="35"/></filter>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000" flood-opacity=".5"/></filter>
 <radialGradient id="halo"><stop stop-color="#e9c983" stop-opacity=".42"/><stop offset="1" stop-color="#e9c983" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="800" rx="34" fill="url(#bgGrad)"/>
<ellipse cx="600" cy="390" rx="300" ry="250" fill="url(#halo)"/>
<circle class="glow" cx="600" cy="430" r="230"/>
<text class="kicker" x="600" y="105">REDONE BARBER AT HOME</text>
<text class="headline serif" x="600" y="164">FREE Facial Scrub with Every Haircut</text>
<text class="copy" x="600" y="202">YOUR NEXT HAIRCUT COMES WITH A SURPRISE</text>
<!-- sparkling burst behind the gift -->
<g class="rays" stroke="#e6c887" stroke-width="2" opacity=".7">
 <path d="M600 272v-40M600 576v-38M412 423h-40M827 423h-40M468 290l-27-27M760 556l-27-27M733 290l27-27M440 556l28-27"/>
 <circle cx="600" cy="422" r="174" fill="none" stroke-dasharray="2 12" opacity=".45"/>
</g>
<!-- floating stars -->
<g fill="#f1d99f">
 <path class="spark s1" d="M387 326l5 13 13 5-13 5-5 13-5-13-13-5 13-5z"/>
 <path class="spark s2" d="M813 315l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
 <path class="spark s3" d="M847 468l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
 <circle class="spark s4" cx="426" cy="493" r="5"/><circle class="spark s5" cx="780" cy="510" r="4"/>
 <path class="spark s6" d="M510 248l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
 <circle class="spark s7" cx="686" cy="252" r="4"/><path class="spark s8" d="M365 426l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
</g>
<!-- inside box and reveal -->
<g class="box">
 <path d="M422 427h356v183H422z" fill="url(#boxGrad)" stroke="#e2c38a" stroke-width="2"/>
 <path d="M422 427h356v28H422z" fill="#d2b178" opacity=".5"/>
 <path d="M565 427h70v183h-70z" fill="url(#ribbon)" opacity=".94"/>
 <path d="M422 427h356" stroke="#f2dfb6" stroke-opacity=".68" stroke-width="2"/>
 <g class="message">
  <rect x="376" y="278" width="448" height="128" rx="18" fill="#17201d" stroke="#d4b67c" stroke-width="1.5"/>
  <path d="M403 301h394" stroke="#d4b67c" opacity=".55"/>
  <text class="small" x="600" y="329">COMPLIMENTARY FACIAL</text>
  <text class="gommage serif" x="600" y="376">Focia Scrub Offer</text>
  <text class="small" x="600" y="395" font-size="10">WITH EVERY HAIRCUT</text>
 </g>
 <!-- lid, bow and ribbon move together -->
 <g class="lid">
  <path d="M405 401h390v48H405z" fill="url(#lidGrad)" stroke="#f0dba9" stroke-width="2"/>
  <path d="M565 401h70v48h-70z" fill="url(#ribbon)"/>
  <path d="M600 401c-65-62-125-12-72 14 26 13 51 3 72-14 24 20 53 29 74 13 45-35-21-72-74-13z" fill="none" stroke="url(#ribbon)" stroke-width="14" stroke-linecap="round"/>
  <path d="M600 400c-5 22-14 43-29 59M601 400c5 22 14 43 29 59" fill="none" stroke="#ead8b1" stroke-width="11" stroke-linecap="round"/>
  <circle cx="600" cy="401" r="10" fill="#f4e6c9"/>
 </g>
</g>
<path d="M490 656h220" stroke="#bda06d" stroke-width="1" opacity=".65"/>
<text class="small" x="600" y="698">A MOMENT OF CARE, JUST FOR YOU</text>
</svg>
